name: Build Swiftgram unsigned IPA
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Swiftgram commit or branch
        required: true
        default: b460f1d8948e725331b34981cc2a563aeeae97fd
      app_bundle_id:
        description: Non-official Bundle ID
        required: true
        default: com.dmslau.sogram
      app_display_name:
        description: Display name
        required: true
        default: Sogram
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scaffold files
        run: |
          python3 -m py_compile scripts/*.py
          test -x scripts/build_swiftgram.sh
          test -f scripts/generate_build_config_swiftgram.py
  build:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout scaffold
        uses: actions/checkout@v4
      - name: Checkout Swiftgram source
        uses: actions/checkout@v4
        with:
          repository: Swiftgram/Telegram-iOS
          ref: ${{ inputs.upstream_ref }}
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: Select upstream Xcode
        run: |
          set -euo pipefail
          v=$(python3 -c 'import json; print(json.load(open("upstream/versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${v}.app/Contents/Developer"
          xcodebuild -version
          echo "UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Restore Bazel cache
        id: bazel-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/swiftgram-bazel-cache
          key: swiftgram-bazel-${{ runner.os }}-${{ hashFiles('upstream/versions.json') }}-${{ inputs.upstream_ref }}
          restore-keys: |
            swiftgram-bazel-${{ runner.os }}-${{ hashFiles('upstream/versions.json') }}-
            swiftgram-bazel-${{ runner.os }}-
      - name: Build and package
        env:
          APIID: ${{ secrets.APIID }}
          APIHASH: ${{ secrets.APIHASH }}
          APP_BUNDLE_ID: ${{ inputs.app_bundle_id }}
          APP_DISPLAY_NAME: ${{ inputs.app_display_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/build_swiftgram.sh
      - name: Save Bazel cache
        if: always() && steps.bazel-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/swiftgram-bazel-cache
          key: swiftgram-bazel-${{ runner.os }}-${{ hashFiles('upstream/versions.json') }}-${{ inputs.upstream_ref }}
      - name: Verify IPA
        run: test -s artifacts/Sogram.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftgram-unsigned-ipa-${{ github.run_number }}
          path: artifacts/Sogram.ipa
          retention-days: 14
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="swiftgram-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" artifacts/Sogram.ipa --repo "$GITHUB_REPOSITORY" --title "Swiftgram unsigned ${GITHUB_RUN_NUMBER}" --notes "Unsigned Swiftgram IPA; source commit ${UPSTREAM_COMMIT}."
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Sogram.ipa" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup old releases (keep latest 1)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName,createdAt --jq '.[] | "\(.tagName)\t\(.createdAt)"' | sort -k2 | head -n -1 | while read tag _; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes
          done
      - name: Bark notification
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          test -n "$BARK_KEY"
          curl --fail-with-body --retry 3 --get --data-urlencode "title=Swiftgram ${JOB_STATUS}" --data-urlencode "body=${GITHUB_REPOSITORY} #${GITHUB_RUN_NUMBER}: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "https://api.day.app/${BARK_KEY}"
